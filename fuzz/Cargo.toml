[package]
name = "pairdeck-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
pairdeck = { path = ".." }
crossterm = "0.29"
toml = "1"
image = { version = "0.25", default-features = false }

# Keep the fuzz crate out of the main package's workspace.
[workspace]
members = ["."]

[profile.release]
debug = 1

[[bin]]
name = "archive"
path = "fuzz_targets/archive.rs"
test = false
doc = false
bench = false

