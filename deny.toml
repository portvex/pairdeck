# cargo-deny configuration: `cargo deny check`
[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
ignore = [
    { id = "RUSTSEC-2025-0141", reason = "bincode is only used by syntect to load its bundled, trusted dumps" },
    { id = "RUSTSEC-2026-0543", reason = "chrono is unmaintained with no successor release; it also comes in through russh-sftp, russh-util and trash, so it cannot be dropped until they move off it. No known vulnerability" },
    { id = "RUSTSEC-2023-0071", reason = "rsa (via russh): no fixed release; only used to sign the SFTP login challenge with a local id_rsa file, once per connection. Host key checks are public-key operations; agent keys are signed by the agent" },
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
    "0BSD",
    "MPL-2.0",
    # bzip2 reference implementation license (permissive, BSD-style)
    "bzip2-1.0.6",
    # webpki-roots (Mozilla CA root certificates for TLS in ureq): permissive data license
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
