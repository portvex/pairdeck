name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly fuzzing smoke run.
    - cron: "17 3 * * *"
  workflow_dispatch:
  # The release workflow runs the same checks before building.
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Same commands as the cargo-husky pre-commit hook.
  lint:
    name: fmt + clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Same command as the pre-push hook: unit tests plus the UI flow tests.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: git identity for the git integration tests
        run: |
          git config --global user.name "pairdeck ci"
          git config --global user.email "ci@example.invalid"
      - run: cargo test --locked

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reads .cargo/audit.toml for the reviewed exceptions.
      - run: cargo audit

  # Linux packages: built and installed in Debian, Fedora, Alpine and Arch like a
  # release does, so packaging problems show up in pull requests.
  packages:
    name: packages (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, arch: x86_64, deb: amd64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, arch: aarch64, deb: arm64 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target "$TARGET"
      - run: scripts/check-static.sh "target/$TARGET/release/pdeck"
      - name: man page, completions and standalone file
        run: |
          bin="target/$TARGET/release/pdeck"
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p target/assets/completions dist
          "$bin" --man > target/assets/pdeck.1
          "$bin" --completions bash > target/assets/completions/pdeck.bash
          "$bin" --completions zsh > target/assets/completions/_pdeck
          "$bin" --completions fish > target/assets/completions/pdeck.fish
          cp "$bin" "dist/pdeck-$version-${{ matrix.arch }}-linux"
      - uses: ./.github/actions/setup-nfpm
      - run: scripts/package.sh "target/$TARGET/release/pdeck" target/assets "${{ matrix.deb }}" dist "$VERSION"
      - run: scripts/test-packages.sh dist "$VERSION" "${{ matrix.arch }}"

  # The Nix flake (Linux only) builds from source with the pinned Cargo.lock and
  # nixpkgs from flake.lock.
  nix:
    name: nix flake (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: flake.lock is committed and current
        id: lock
        run: |
          nix flake lock
          if ! git ls-files --error-unmatch flake.lock >/dev/null 2>&1 || ! git diff --quiet -- flake.lock; then
            echo "::error::flake.lock is missing or out of date: commit the flake-lock artifact of this run"
            echo "stale=1" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.lock.outputs.stale == '1' && matrix.os == 'ubuntu-latest'
        with:
          name: flake-lock
          path: flake.lock
      - name: build and run
        run: |
          nix flake check -L
          nix run . -- --version
          ls result 2>/dev/null || nix build -L
          test -f result/share/man/man1/pdeck.1.gz
          test -f result/share/zsh/site-functions/_pdeck
      - if: steps.lock.outputs.stale == '1'
        run: exit 1

  # Pull requests replay the saved crash inputs; the nightly run also fuzzes
  # every target for a minute.
  fuzz:
    name: fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz
      - name: replay regressions
        run: ./fuzz/run.sh replay
      - name: fuzz every target for 60 s
        # Not when called from the release workflow (there the event is its workflow_dispatch).
        if: github.workflow == 'CI' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          cd fuzz
          for t in $(cargo +nightly fuzz list); do
            ./run.sh "$t" 60
          done
      - name: keep crash inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
          if-no-files-found: ignore
