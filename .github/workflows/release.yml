name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static musl binaries: OpenSSL and libssh2 are vendored, so nothing
          # needs to be installed on the target system.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        shell: bash
        run: |
          name="pairdeck-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/pdeck" README.md LICENSE "dist/$name/"
          # Man page and shell completions (only from binaries this runner can execute).
          bin="target/${{ matrix.target }}/release/pdeck"
          if "$bin" --version >/dev/null 2>&1; then
            mkdir -p "dist/$name/completions"
            "$bin" --man > "dist/$name/pdeck.1"
            "$bin" --completions bash > "dist/$name/completions/pdeck.bash"
            "$bin" --completions zsh > "dist/$name/completions/_pdeck"
            "$bin" --completions fish > "dist/$name/completions/pdeck.fish"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # The universal macOS job needs the bare binary too.
          cp "target/${{ matrix.target }}/release/pdeck" "dist/pdeck-${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/pdeck-*

  universal-macos:
    name: universal macOS binary
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*-apple-darwin
          merge-multiple: true
          path: in
      - name: lipo
        run: |
          name="pairdeck-${GITHUB_REF_NAME}-universal-apple-darwin"
          mkdir -p "dist/$name"
          lipo -create -output "dist/$name/pdeck" in/pdeck-aarch64-apple-darwin in/pdeck-x86_64-apple-darwin
          lipo -info "dist/$name/pdeck"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/upload-artifact@v4
        with:
          name: build-universal-apple-darwin
          path: dist/*.tar.gz

  release:
    name: publish release
    needs: [build, universal-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: checksums
        run: |
          cd dist
          rm -f pdeck-*
          sha256sum *.tar.gz > sha256sums.txt
          cat sha256sums.txt
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.tar.gz
            dist/sha256sums.txt
          generate_release_notes: true
