name: Release

# Start a release with the "Run workflow" button (Actions > Release) and the version
# from Cargo.toml, e.g. 0.2.0. Pushing a tag v0.2.0 works too. Either way the version
# must match Cargo.toml, the full CI runs first, and the tag is created only when every
# build has succeeded.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v (must match Cargo.toml)"
        required: true
        type: string
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::release from main, not $GITHUB_REF"; exit 1; }
            version=${INPUT#v}
            if git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
              echo "::error::tag v$version already exists"; exit 1
            fi
          else
            version=${GITHUB_REF_NAME#v}
          fi
          echo "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' ||
            { echo "::error::'$version' is not a version like 1.2.3"; exit 1; }
          cargo_version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          [ "$cargo_version" = "$version" ] ||
            { echo "::error::Cargo.toml has version $cargo_version, not $version: bump it first"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  ci:
    name: CI
    needs: prepare
    uses: ./.github/workflows/ci.yml

  build:
    name: build ${{ matrix.target }}
    needs: [prepare, ci]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          # Static musl binaries: no OpenSSL, and every C library is compiled in, so nothing
          # needs to be installed on the target system.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            deb: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            deb: true
          # macOS builds run on Intel; the Apple silicon binary is cross-compiled there
          # (Xcode's toolchain targets both, so nothing extra is installed).
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-15-intel
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: musl toolchain
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --profile static --locked --target "$TARGET"
      - name: verify the binary is self-contained
        run: scripts/check-static.sh "target/$TARGET/static/pdeck"
      - name: man page and completions
        shell: bash
        run: |
          bin="target/$TARGET/static/pdeck"
          mkdir -p target/assets/completions
          if "$bin" --version >/dev/null 2>&1; then
            "$bin" --version | grep -q "$VERSION" || { echo "::error::binary reports $("$bin" --version)"; exit 1; }
            "$bin" --man > target/assets/pdeck.1
            for sh in bash zsh fish; do "$bin" --completions "$sh" > "target/assets/completions/$sh"; done
            mv target/assets/completions/bash target/assets/completions/pdeck.bash
            mv target/assets/completions/zsh target/assets/completions/_pdeck
            mv target/assets/completions/fish target/assets/completions/pdeck.fish
          fi
      - name: package
        shell: bash
        run: |
          name="pairdeck-$VERSION-$TARGET"
          mkdir -p "dist/$name"
          cp "target/$TARGET/static/pdeck" README.md LICENSE "dist/$name/"
          if [ -f target/assets/pdeck.1 ]; then
            cp target/assets/pdeck.1 "dist/$name/"
            cp -R target/assets/completions "dist/$name/"
          fi
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          rm -rf "dist/$name"
          # The universal macOS job needs the bare binary too.
          cp "target/$TARGET/static/pdeck" "dist/pdeck-$TARGET"
      - name: Debian package
        if: matrix.deb
        run: |
          cargo install cargo-deb --locked --version 3.8.0
          cargo deb --no-build --no-strip --target "$TARGET" --profile static --deb-version "$VERSION" -o dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          # Install it for real: the package must be accepted by dpkg and the command run.
          sudo dpkg -i dist/*.deb
          pdeck --version | grep -q "$VERSION"
          man -w pdeck
          sudo dpkg -r pairdeck
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.deb
      - uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/pdeck-*
          if-no-files-found: error

  universal-macos:
    name: universal macOS binary
    needs: [prepare, build]
    runs-on: macos-15-intel
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*-apple-darwin
          merge-multiple: true
          path: in
      - name: lipo and package
        run: |
          name="pairdeck-$VERSION-universal-apple-darwin"
          mkdir -p "dist/$name/completions"
          bin="dist/$name/pdeck"
          lipo -create -output "$bin" in/pdeck-aarch64-apple-darwin in/pdeck-x86_64-apple-darwin
          chmod 755 "$bin"
          lipo -info "$bin"
          scripts/check-static.sh "$bin"
          "$bin" --man > "dist/$name/pdeck.1"
          "$bin" --completions bash > "dist/$name/completions/pdeck.bash"
          "$bin" --completions zsh > "dist/$name/completions/_pdeck"
          "$bin" --completions fish > "dist/$name/completions/pdeck.fish"
          cp README.md LICENSE "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: build-universal-apple-darwin
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish GitHub release
    needs: [prepare, build, universal-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: build-*
          merge-multiple: true
          path: dist
      - name: checksums and Homebrew formula
        run: |
          rm -f dist/pdeck-*
          (cd dist && sha256sum -- *.tar.gz *.deb > sha256sums.txt && cat sha256sums.txt)
          scripts/homebrew-formula.sh "$VERSION" dist/sha256sums.txt > dist/pairdeck.rb
      - name: publish
        shell: bash
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --title "pairdeck $VERSION" --generate-notes)
          case "$VERSION" in *-*) args+=(--prerelease) ;; esac
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            # Creates the tag on the commit that was built and tested.
            args+=(--target "$GITHUB_SHA")
          else
            args+=(--verify-tag)
          fi
          gh release create "v$VERSION" dist/* "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: homebrew-formula
          path: dist/pairdeck.rb

  homebrew:
    name: update Homebrew tap
    needs: [prepare, release]
    if: ${{ !contains(needs.prepare.outputs.version, '-') }}
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAP_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: homebrew-formula
      # The tap is pushed with a deploy key that can write to portvex/homebrew-tap only.
      - name: push the formula
        run: |
          if [ -z "$TAP_KEY" ]; then
            echo "::warning::HOMEBREW_TAP_DEPLOY_KEY is not set; the tap was not updated"
            exit 0
          fi
          key="$RUNNER_TEMP/tap-key"
          printf '%s\n' "$TAP_KEY" > "$key"
          chmod 600 "$key"
          export GIT_SSH_COMMAND="ssh -i $key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:portvex/homebrew-tap.git "$RUNNER_TEMP/tap"
          cp pairdeck.rb "$RUNNER_TEMP/tap/Formula/pairdeck.rb"
          cd "$RUNNER_TEMP/tap"
          git add Formula/pairdeck.rb
          if git diff --cached --quiet; then
            echo "the tap already has this formula"
          else
            git -c user.name=portvex -c user.email=347037878+portvex@users.noreply.github.com \
              commit -m "pairdeck $VERSION"
            git push origin HEAD
          fi

  crates-io:
    name: publish to crates.io
    needs: [prepare, release]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: cargo publish
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set; not published to crates.io"
            exit 0
          fi
          cargo publish --locked
